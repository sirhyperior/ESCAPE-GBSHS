<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d0d">
    <title>기숙사 탈출하기</title>
    <link rel="stylesheet" href="style.css">
    <script src="game-map.js" defer></script>
    <script src="game-items.js" defer></script>
    <script src="game-core.js" defer></script>
    <script src="game-audio.js" defer></script>
    <script src="game-dialogue.js" defer></script>
    <script src="game-horror.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game" aria-label="기숙사 탈출하기">
      <canvas id="scene" aria-hidden="true"></canvas>

      <div class="hud" id="hud" hidden>
        <div class="floor-panel">
          <span class="area-name" id="area-name" hidden></span>
          <div class="floor-number"><span id="floor">5</span><span class="floor-unit" id="floor-unit">층</span></div>
          <span class="objective" id="objective">아래층 계단 찾기</span>
        </div>

        <div class="item-card secret-prompt" id="secret-prompt" role="status" hidden>
          <div class="dialogue-bubble">
            <p class="item-name">비밀 통로</p>
            <div class="dialogue-controls"><kbd>Space</kbd><span>키패드 열기</span></div>
          </div>
        </div>

        <div class="stamina-panel">
          <div class="stamina-heading">
            <label for="stamina">스태미나</label>
            <span class="stamina-percent" id="stamina-percent" aria-hidden="true">100%</span>
          </div>
          <meter id="stamina" min="0" max="4" value="4">100%</meter>
          <div class="inventory" aria-label="소지품">
            <div class="inventory-slot" id="passive-slot" role="group">
              <div class="inventory-cell"><canvas width="12" height="12" aria-hidden="true" hidden></canvas></div>
              <span>패시브</span>
            </div>
            <div class="inventory-slot" id="active-slot" role="group">
              <div class="inventory-cell"><canvas width="12" height="12" aria-hidden="true" hidden></canvas></div>
              <span>액티브</span>
            </div>
          </div>
          <span class="fatigue" id="fatigue" role="status" hidden></span>
          <ul class="item-effects" id="item-effects" aria-label="적용 중인 아이템 효과" aria-live="polite" hidden></ul>
          <span class="item-hint" id="item-hint" role="status" hidden>발각되었을 때 사용할 수 있습니다.</span>
        </div>

        <div class="alert" id="alert" role="status" hidden></div>

        <div class="item-card" id="item-card" role="status" hidden>
          <div class="dialogue-bubble">
            <div class="item-summary">
              <canvas width="12" height="12" aria-hidden="true"></canvas>
              <div>
                <p class="item-name"></p>
                <p class="item-description"></p>
              </div>
            </div>
            <div class="dialogue-controls">
              <kbd>Space</kbd><span>줍기</span>
            </div>
          </div>
        </div>

        <div class="play-controls" aria-label="조작법">
          <span><kbd aria-label="화살표 키">↑ ↓ ← →</kbd> 이동</span>
          <span><kbd>Shift</kbd> 달리기</span>
          <span><kbd>Space</kbd> 줍기 · 사용</span>
        </div>
      </div>

      <div class="scene-transition" id="scene-transition" hidden>
        <div class="floor-announcement" id="floor-announcement" role="status"></div>
      </div>

      <div class="dialogue" id="dialogue" role="group" aria-label="대사" hidden>
        <div class="dialogue-bubble">
          <p class="dialogue-text" aria-hidden="true"><span class="dialogue-revealed"></span><span class="dialogue-remaining"></span></p>
          <p class="dialogue-readable" role="status"></p>
          <div class="dialogue-controls"><kbd>Space</kbd><span class="dialogue-action"></span></div>
        </div>
      </div>

      <dialog class="keypad" id="keypad" aria-labelledby="keypad-title" aria-describedby="keypad-help">
        <h2 id="keypad-title">비밀 통로</h2>
        <p id="keypad-help">숫자 네 자리를 입력하세요.</p>
        <output id="keypad-digits" aria-label="입력한 비밀번호">· · · ·</output>
        <div class="keypad-buttons">
          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button type="button" data-keypad="clear">지우기</button>
          <button type="button" data-digit="0">0</button>
          <button type="button" data-keypad="back" aria-label="마지막 숫자 지우기">⌫</button>
        </div>
        <p class="keypad-message" id="keypad-message" role="status"></p>
        <button class="keypad-close" id="keypad-close" type="button">닫기</button>
      </dialog>

      <div class="scare-screen" id="scare-screen" hidden>
        <img src="jeff-the-killer.png" alt="제프 더 킬러">
      </div>

      <section class="screen" id="screen" aria-labelledby="screen-title" data-screen="start">
        <div class="screen-content">
          <div class="screen-mark" aria-hidden="true"></div>
          <h1 id="screen-title">기숙사<br>탈출하기</h1>
          <p id="screen-description">사감 선생님을 피해 5층에서 1층 출구까지 내려가세요.</p>
          <p class="escape-time" id="escape-time" hidden></p>
          <div class="start-controls" id="start-controls" aria-label="조작법">
            <span><kbd aria-label="화살표 키">↑ ↓ ← →</kbd> 이동</span>
            <span><kbd>Shift</kbd> 달리기</span>
            <span><kbd>Space</kbd> 대사 · 줍기 · 사용</span>
          </div>
          <button id="start" type="button">탈출 시작</button>
        </div>
      </section>

      <button class="sound-toggle" id="sound-toggle" type="button" aria-label="게임 소리" aria-pressed="true">소리 켜짐</button>
    </main>
  </body>
</html>
